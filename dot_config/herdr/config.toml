# Catppuccin, switching with the terminal's light/dark report
# (Ghostty follows the macOS appearance).
[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

# Ctrl+Space as a second prefix; Ctrl+b keeps working
[keys]
extra_prefixes = ["ctrl+space"]
