# Colours: only the terminal's ANSI palette and default fg/bg, so tmux follows
# Ghostty's theme (Catppuccin Latte/Mocha with the macOS appearance)
set -g theme terminal

# Terminal: true colour, extended keys, clipboard and passthrough in Ghostty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:clipboard"
set -g extended-keys on
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on
# No delay after Esc (nvim)
set -sg escape-time 0

# General
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "#S: #W"

# Splits and new windows open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Status bar
set -g status-position top
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=blue,bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=brightblack]%H:%M "
setw -g window-status-format "#[fg=brightblack] #I #W "
setw -g window-status-current-format "#[fg=blue,bold] #I #W "
setw -g window-status-separator ""

# Panes, messages and copy mode
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=yellow"
setw -g mode-style "bg=blue,fg=black"
